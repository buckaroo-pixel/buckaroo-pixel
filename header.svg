<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <!-- Неоновое свечение Нави -->
    <filter id="navi-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="fairy-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#70d6ff" />
      <stop offset="85%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .zelda-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #f0f6fc;
      text-anchor: middle;
      opacity: 0;
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #70d6ff;
      text-anchor: middle;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1.2s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Анимация парения феи */
    .navi-group {
      animation: naviFloat 3s ease-in-out infinite alternate;
      transform-origin: 220px 45px;
    }

    /* Трепетание крылышек */
    .wing-left {
      animation: wingFlapLeft 0.22s ease-in-out infinite alternate;
      transform-origin: 220px 42px;
    }
    .wing-right {
      animation: wingFlapRight 0.22s ease-in-out infinite alternate;
      transform-origin: 220px 42px;
    }

    /* Мерцающие искры вокруг */
    .sparkle-1 { animation: sparkle 1.6s infinite ease-in-out 0.2s; }
    .sparkle-2 { animation: sparkle 2.1s infinite ease-in-out 0.8s; }
    .sparkle-3 { animation: sparkle 1.8s infinite ease-in-out 1.2s; }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(35px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 0.85; }
    }

    @keyframes naviFloat {
      0% { transform: translate(0, 0); }
      50% { transform: translate(4px, -8px); }
      100% { transform: translate(-3px, 4px); }
    }

    @keyframes wingFlapLeft {
      0% { transform: rotate(0deg) scaleX(1); }
      100% { transform: rotate(-18deg) scaleX(0.65); }
    }

    @keyframes wingFlapRight {
      0% { transform: rotate(0deg) scaleX(1); }
      100% { transform: rotate(18deg) scaleX(0.65); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.1; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <!-- Блок с текстом (выплывает снизу) -->
  <g>
    <!-- Отсылка мелким шрифтом прямо над Hello -->
    <text x="50%" y="30" class="subtitle">✦ "Hey, Listen!" ✦</text>

    <!-- Основная фраза -->
    <text x="50%" y="78" class="zelda-title">
      Hello, I'm Imran 👋
    </text>
  </g>

  <!-- Фея Нави парит прямо над словом "Hello" -->
  <g class="navi-group" transform="translate(25, 10)">
    <!-- Искорки/пыльца вокруг Нави -->
    <circle cx="215" cy="30" r="2.5" fill="#e0fbfc" class="sparkle-1" filter="url(#navi-glow)"/>
    <circle cx="250" cy="55" r="2" fill="#70d6ff" class="sparkle-2" filter="url(#navi-glow)"/>
    <circle cx="205" cy="65" r="1.8" fill="#ffffff" class="sparkle-3" filter="url(#navi-glow)"/>

    <!-- Левое крылышко -->
    <ellipse cx="215" cy="38" rx="14" ry="5" fill="#caf0f8" opacity="0.6" class="wing-left" transform="rotate(-30 220 45)" />
    
    <!-- Правое крылышко -->
    <ellipse cx="241" cy="38" rx="14" ry="5" fill="#caf0f8" opacity="0.6" class="wing-right" transform="rotate(30 228 45)" />

    <!-- Сияющее ядро феи -->
    <circle cx="228" cy="46" r="16" fill="url(#fairy-core)" filter="url(#navi-glow)"/>
    <circle cx="228" cy="46" r="6" fill="#ffffff"/>
  </g>
</svg>
