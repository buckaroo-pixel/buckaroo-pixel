name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: buckaroo-pixel
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#22c55e&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#86efac&color_dots=#1e241c,#223321,#285020,#387c2e,#86efac

      - name: Fix permissions and wrap snake
        run: |
          sudo chown -R $USER:$USER dist
          python3 scripts/wrap.py
          mkdir -p assets
          cp dist/github-contribution-grid-snake.svg assets/snake-light.svg
          cp dist/github-contribution-grid-snake-dark.svg assets/snake-dark.svg

      - name: Commit and push to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake-light.svg assets/snake-dark.svg
          git commit -m "Update contribution snake assets" || exit 0
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
