name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: buckaroo-pixel
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#22c55e&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#86efac&color_dots=#121d15,#1b3823,#22c55e,#4ade80,#86efac

      - name: Add Material You Card Frame
        run: |
          sed -i 's|<svg class="subnav-canvas"|<svg class="subnav-canvas" style="background:#101712;border:1.5px solid #1d2c20;border-radius:28px;padding:12px;box-sizing:border-box"|g' dist/github-contribution-grid-snake-dark.svg
          sed -i 's|<svg class="subnav-canvas"|<svg class="subnav-canvas" style="background:#f4fbf4;border:1.5px solid #dce5dc;border-radius:28px;padding:12px;box-sizing:border-box"|g' dist/github-contribution-grid-snake.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
