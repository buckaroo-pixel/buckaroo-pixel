<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <radialGradient id="naviCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .zelda-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #f0f6fc;
      text-anchor: middle;
      opacity: 0;
      animation: slideUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #38bdf8;
      text-anchor: middle;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1.1s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .navi-container {
      animation: floatNavi 3.2s ease-in-out infinite alternate;
      transform-origin: 300px 72px;
    }

    .wing-l {
      animation: flapL 0.2s ease-in-out infinite alternate;
      transform-origin: 298px 70px;
    }

    .wing-r {
      animation: flapR 0.2s ease-in-out infinite alternate;
      transform-origin: 302px 70px;
    }

    .aura {
      animation: pulseAura 1.8s ease-in-out infinite alternate;
      transform-origin: 300px 72px;
    }

    .sparkle {
      animation: twinkle 1.6s ease-in-out infinite alternate;
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 0.95; }
    }

    @keyframes floatNavi {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px) translateX(3px); }
      100% { transform: translateY(4px) translateX(-2px); }
    }

    @keyframes flapL {
      0% { transform: rotate(-25deg) scaleX(1); }
      100% { transform: rotate(-8deg) scaleX(0.5); }
    }

    @keyframes flapR {
      0% { transform: rotate(25deg) scaleX(1); }
      100% { transform: rotate(8deg) scaleX(0.5); }
    }

    @keyframes pulseAura {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.9; }
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <!-- Цитата Нави -->
  <text x="50%" y="34" class="subtitle">✦ "Hey, Listen!" ✦</text>

  <!-- Имя (крупно по центру) -->
  <text x="50%" y="84" class="zelda-title">I'm Imran</text>

  <!-- Фея Нави парит чуть левее имени -->
  <g class="navi-container">
    <circle cx="300" cy="72" r="34" fill="#0284c7" opacity="0.12" class="aura" />
    <circle cx="300" cy="72" r="22" fill="#38bdf8" opacity="0.25" class="aura" />
    <circle cx="300" cy="72" r="14" fill="#7dd3fc" opacity="0.45" />

    <!-- Крылышки -->
    <ellipse cx="292" cy="66" rx="12" ry="4" fill="#e0f2fe" opacity="0.75" class="wing-l" />
    <ellipse cx="308" cy="66" rx="12" ry="4" fill="#e0f2fe" opacity="0.75" class="wing-r" />

    <!-- Ядро Нави -->
    <circle cx="300" cy="72" r="10" fill="url(#naviCore)" />
    <circle cx="300" cy="72" r="4" fill="#ffffff" />

    <!-- Пыльца -->
    <circle cx="282" cy="64" r="1.8" fill="#bae6fd" class="sparkle" />
    <circle cx="318" cy="82" r="1.4" fill="#ffffff" class="sparkle" style="animation-delay: 0.8s;" />
  </g>
</svg>
