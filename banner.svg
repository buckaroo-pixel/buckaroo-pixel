<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <radialGradient id="naviCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .zelda-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #f0f6fc;
      text-anchor: middle;
      opacity: 0;
      animation: slideUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #38bdf8;
      text-anchor: middle;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1.1s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .navi-container {
      animation: floatNavi 3.2s ease-in-out infinite alternate;
      transform-origin: 260px 72px;
    }

    .wing-l {
      animation: flapL 0.2s ease-in-out infinite alternate;
      transform-origin: 258px 70px;
    }

    .wing-r {
      animation: flapR 0.2s ease-in-out infinite alternate;
      transform-origin: 262px 70px;
    }

    .aura {
      animation: pulseAura 2s ease-in-out infinite alternate;
      transform-origin: 260px 72px;
    }

    .sparkle {
      animation: twinkle 1.8s ease-in-out infinite alternate;
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 0.9; }
    }

    @keyframes floatNavi {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px) translateX(2px); }
      100% { transform: translateY(4px) translateX(-2px); }
    }

    @keyframes flapL {
      0% { transform: rotate(-22deg) scaleX(1); }
      100% { transform: rotate(-6deg) scaleX(0.55); }
    }

    @keyframes flapR {
      0% { transform: rotate(22deg) scaleX(1); }
      100% { transform: rotate(6deg) scaleX(0.55); }
    }

    @keyframes pulseAura {
      0% { transform: scale(0.9); opacity: 0.35; }
      100% { transform: scale(1.1); opacity: 0.65; }
    }

    @keyframes twinkle {
      0% { opacity: 0.15; transform: scale(0.6); }
      100% { opacity: 0.9; transform: scale(1.2); }
    }
  </style>

  <!-- Цитата Нави по центру -->
  <text x="50%" y="34" class="subtitle">✦ "Hey, Listen!" ✦</text>

  <!-- Имя по центру (будет полностью видно) -->
  <text x="50%" y="84" class="zelda-title">I'm Imran</text>

  <!-- Фея Нави парит сбоку слева -->
  <g class="navi-container">
    <!-- Полупрозрачные мягкие круги свечения -->
    <circle cx="260" cy="72" r="22" fill="#0284c7" opacity="0.1" class="aura" />
    <circle cx="260" cy="72" r="14" fill="#38bdf8" opacity="0.2" class="aura" />

    <!-- Крылышки -->
    <ellipse cx="253" cy="67" rx="10" ry="3.5" fill="#e0f2fe" opacity="0.65" class="wing-l" />
    <ellipse cx="267" cy="67" rx="10" ry="3.5" fill="#e0f2fe" opacity="0.65" class="wing-r" />

    <!-- Ядро Нави -->
    <circle cx="260" cy="72" r="8" fill="url(#naviCore)" />
    <circle cx="260" cy="72" r="3" fill="#ffffff" />

    <!-- Мелкие искры -->
    <circle cx="245" cy="65" r="1.4" fill="#bae6fd" class="sparkle" />
    <circle cx="274" cy="80" r="1.2" fill="#ffffff" class="sparkle" style="animation-delay: 0.8s;" />
  </g>
</svg>
