<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <!-- Очень мягкое, естественное сияние Нави (уменьшено и приглушено) -->
    <radialGradient id="naviCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .zelda-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #f0f6fc;
      opacity: 0;
      animation: slideUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #38bdf8;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1.1s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Анимация плавного полета феи */
    .navi-container {
      animation: floatNavi 3.2s ease-in-out infinite alternate;
      transform-origin: 150px 72px;
    }

    /* Быстрые взмахи маленьких крыльев */
    .wing-l {
      animation: flapL 0.2s ease-in-out infinite alternate;
      transform-origin: 148px 70px;
    }

    .wing-r {
      animation: flapR 0.2s ease-in-out infinite alternate;
      transform-origin: 152px 70px;
    }

    .aura {
      animation: pulseAura 2s ease-in-out infinite alternate;
      transform-origin: 150px 72px;
    }

    .sparkle {
      animation: twinkle 1.8s ease-in-out infinite alternate;
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 0.95; }
    }

    @keyframes floatNavi {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px) translateX(2px); }
      100% { transform: translateY(3px) translateX(-2px); }
    }

    @keyframes flapL {
      0% { transform: rotate(-22deg) scaleX(1); }
      100% { transform: rotate(-6deg) scaleX(0.55); }
    }

    @keyframes flapR {
      0% { transform: rotate(22deg) scaleX(1); }
      100% { transform: rotate(6deg) scaleX(0.55); }
    }

    @keyframes pulseAura {
      0% { transform: scale(0.85); opacity: 0.25; }
      100% { transform: scale(1.1) opacity: 0.45; }
    }

    @keyframes twinkle {
      0% { opacity: 0.15; transform: scale(0.6); }
      100% { opacity: 0.8; transform: scale(1.1); }
    }
  </style>

  <!-- Надпись "Hey, Listen!" - теперь сдвинута правее, чтобы быть по центру относительно имени -->
  <text x="500" y="34" class="subtitle" text-anchor="middle">✦ "Hey, Listen!" ✦</text>

  <!-- Имя, сдвинутое правее, полностью свободное для чтения -->
  <text x="500" y="84" class="zelda-title" text-anchor="middle">I'm Imran</text>

  <!-- Маленькая фея Нави, отодвинутая далеко влево (координаты X перенесены на 150) -->
  <g class="navi-container" transform="translate(20, 0)">
    <!-- Приглушенные внешние круги свечения (opacity значительно снижен) -->
    <circle cx="150" cy="72" r="18" fill="#0284c7" opacity="0.06" class="aura" />
    <circle cx="150" cy="72" r="10" fill="#38bdf8" opacity="0.12" class="aura" />

    <!-- Крылышки (уменьшены) -->
    <ellipse cx="144" cy="68" rx="8" ry="3" fill="#e0f2fe" opacity="0.55" class="wing-l" />
    <ellipse cx="156" cy="68" rx="8" ry="3" fill="#e0f2fe" opacity="0.55" class="wing-r" />

    <!-- Ядро Нави (сделано компактнее) -->
    <circle cx="150" cy="72" r="6" fill="url(#naviCore)" />
    <circle cx="150" cy="72" r="2" fill="#ffffff" />

    <!-- Мелкие искры -->
    <circle cx="138" cy="66" r="1" fill="#bae6fd" class="sparkle" />
    <circle cx="162" cy="79" r="0.8" fill="#ffffff" class="sparkle" style="animation-delay: 0.8s;" />
  </g>
</svg>
